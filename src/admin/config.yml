local_backend: true
backend:
  name: git-gateway
  branch: main

media_folder: "src/assets/images"
public_folder: "/assets/images"

collections:
  - name: "casos"
    label: "Casos de Estudio"
    folder: "src/casos"
    create: true
    slug: "{{order}}-{{slug}}"
    fields:
      - { label: "Título del Caso", name: "title", widget: "string", hint: "Ej: De $80K Tradicional a $500K de ROI Digital" }
      - { label: "Empresa / Cliente", name: "company", widget: "string" }
      - { label: "Período / Contexto", name: "period", widget: "string", hint: "Ej: 2018–2021 o E-Commerce & POD" }
      - { label: "Etiqueta (Eyebrow)", name: "eyebrow", widget: "string", hint: "Ej: CASO 01" }
      - { label: "Orden", name: "order", widget: "number", value_type: "int", hint: "Número de orden en el carousel (1, 2, 3...)" }
      - label: "Tags / Disciplinas"
        name: "tags"
        widget: "list"
        hint: "Ej: Growth Marketing, SEO, Brand Strategy"
      - { label: "Resumen (para la tarjeta)", name: "summary", widget: "text", hint: "2–3 oraciones. Aparece en la tarjeta del carousel." }
      - label: "Métricas Clave (hasta 4)"
        name: "metrics"
        widget: "list"
        max: 4
        fields:
          - { label: "Valor", name: "value", widget: "string", hint: "Ej: $500K+" }
          - { label: "Etiqueta", name: "label", widget: "string", hint: "Ej: ROI Comprobable" }
      - { label: "S — Situación", name: "situation", widget: "text" }
      - { label: "T — Tarea", name: "task", widget: "text" }
      - { label: "A — Acción", name: "action", widget: "text" }
      - { label: "R — Resultado", name: "result", widget: "text" }
      - { label: "+ Aprendizaje Clave", name: "learning", widget: "text", required: false }

  - name: "pages"
    label: "Páginas"
    files:
      - label: "Página de Inicio"
        name: "homepage"
        file: "src/_data/homepage.json"
        format: "json"
        fields:
          - { label: "Título SEO", name: "title", widget: "string", hint: "Aparece en la pestaña del navegador." }
          - { label: "Descripción SEO", name: "seo_description", widget: "text", hint: "Aparece en los resultados de Google." }
          - label: "Menú Superior (Header)"
            name: "header_nav"
            widget: "list"
            fields:
              - { label: "Etiqueta", name: "label", widget: "string" }
              - { label: "URL / Ancla", name: "url", widget: "string", hint: "Ej: #work o /about/" }
          - label: "Menú Flotante (Iconos)"
            name: "floating_nav"
            widget: "list"
            fields:
              - { label: "Etiqueta", name: "label", widget: "string" }
              - { label: "URL / Ancla", name: "url", widget: "string" }
              - { label: "Icono (Material Symbol)", name: "icon", widget: "string", hint: "Ej: home, grid_view, person, mail" }
          - label: "Hero — Sección Principal"
            name: "hero"
            widget: "object"
            hint: "El bloque grande de texto al entrar al sitio."
            fields:
              - { label: "Eyebrow (texto pequeño arriba)", name: "eyebrow", widget: "string", hint: "Ej: MARKETING PORTFOLIO · 2026" }
              - { label: "Título Línea 1", name: "title_line1", widget: "string", hint: "Ej: Arquitecto de" }
              - { label: "Título Línea 2 (color gris)", name: "title_line2", widget: "string", hint: "Ej: Sistemas de" }
              - { label: "Título Línea 3", name: "title_line3", widget: "string", hint: "Ej: Crecimiento." }
              - { label: "Descripción (subtítulo)", name: "description", widget: "text" }
              - { label: "Imagen de Retrato", name: "image", widget: "image" }
              - label: "Botones del Hero"
                name: "buttons"
                widget: "list"
                max: 2
                fields:
                  - { label: "Texto del Botón", name: "label", widget: "string" }
                  - { label: "URL", name: "url", widget: "string" }
                  - { label: "Estilo Principal (Negro)", name: "primary", widget: "boolean", default: true }
          - label: "About — Grid de 4 columnas"
            name: "about"
            widget: "list"
            hint: "Las 4 tarjetas de información debajo del hero (Background, Expertise, Stack, Ubicación)."
            fields:
              - { label: "Título de la columna", name: "title", widget: "string" }
              - { label: "Descripción", name: "description", widget: "string" }
          - label: "Métricas Principales"
            name: "metrics"
            widget: "list"
            hint: "Los 6 recuadros negros con números grandes."
            fields:
              - { label: "Valor (número grande)", name: "value", widget: "string", hint: "Ej: $500K+" }
              - { label: "Etiqueta (texto pequeño)", name: "label", widget: "string", hint: "Ej: ROI Comprobable" }
          - label: "Stack & Metodología"
            name: "stack"
            widget: "list"
            hint: "Las píldoras/chips de herramientas (Meta Ads, GA4, etc.)."
            fields:
              - { label: "Herramienta", name: "tool", widget: "string" }
          - label: "Filosofía — Sección de cita"
            name: "philosophy"
            widget: "object"
            hint: "La sección con la cita grande entre las dos líneas horizontales."
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string", hint: "Ej: Filosofía de Trabajo" }
              - { label: "Cita Principal", name: "quote", widget: "text", hint: "El texto grande entre comillas." }
              - { label: "Descripción secundaria", name: "description", widget: "text" }
          - label: "Contacto — Sección final"
            name: "contact"
            widget: "object"
            hint: "La sección de contacto al final de la página."
            fields:
              - { label: "Badge de disponibilidad", name: "badge", widget: "string", hint: "Ej: Disponible para Nuevos Proyectos" }
              - { label: "Título principal", name: "title", widget: "string", hint: "Ej: ¿Construimos algo juntos?" }
              - { label: "Correo electrónico", name: "email", widget: "string" }
              - { label: "URL de LinkedIn", name: "linkedin", widget: "string" }

      - label: "Configuración del Sitio"
        name: "settings"
        file: "src/_data/settings.json"
        format: "json"
        fields:
          - label: "Google Analytics"
            name: "google_analytics"
            widget: "object"
            hint: "Configuración del tracking de Google Analytics."
            fields:
              - { label: "Activar Google Analytics", name: "enabled", widget: "boolean", default: true, hint: "Activa o desactiva el script de tracking en todo el sitio." }
              - { label: "Measurement ID", name: "measurement_id", widget: "string", hint: "El ID de medición de GA4. Formato: G-XXXXXXXXXX. Lo encuentras en Google Analytics > Admin > Data Streams.", pattern: ["^G-[A-Z0-9]{6,12}$", "El formato debe ser G- seguido de 6 a 12 caracteres alfanuméricos (ej: G-5YTRMTDDSZ)."] }
