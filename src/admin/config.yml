backend:
  name: git-gateway
  branch: main

media_folder: "src/assets/images"
public_folder: "/assets/images"

collections:
  - name: "casos"
    label: "Casos de Estudio"
    folder: "src/casos"
    create: true
    slug: "{{order}}-{{slug}}"
    fields:
      - { label: "Título del Caso", name: "title", widget: "string", hint: "Ej: De $80K Tradicional a $500K de ROI Digital" }
      - { label: "Empresa / Cliente", name: "company", widget: "string" }
      - { label: "Período / Contexto", name: "period", widget: "string", hint: "Ej: 2018–2021 o E-Commerce & POD" }
      - { label: "Etiqueta (Eyebrow)", name: "eyebrow", widget: "string", hint: "Ej: CASO 01" }
      - { label: "Orden", name: "order", widget: "number", value_type: "int", hint: "Número de orden en el carousel (1, 2, 3...)" }
      - label: "Tags / Disciplinas"
        name: "tags"
        widget: "list"
        hint: "Ej: Growth Marketing, SEO, Brand Strategy"
      - { label: "Resumen (para la tarjeta)", name: "summary", widget: "text", hint: "2–3 oraciones. Aparece en la tarjeta del carousel." }
      - label: "Métricas Clave (hasta 4)"
        name: "metrics"
        widget: "list"
        max: 4
        fields:
          - { label: "Valor", name: "value", widget: "string", hint: "Ej: $500K+" }
          - { label: "Etiqueta", name: "label", widget: "string", hint: "Ej: ROI Comprobable" }
      - { label: "S — Situación", name: "situation", widget: "text" }
      - { label: "T — Tarea", name: "task", widget: "text" }
      - { label: "A — Acción", name: "action", widget: "text" }
      - { label: "R — Resultado", name: "result", widget: "text" }
      - { label: "+ Aprendizaje Clave", name: "learning", widget: "text", required: false }

  - name: "pages"
    label: "Páginas"
    files:
      - label: "Página de Inicio"
        name: "index"
        file: "src/index.njk"
        fields:
          - { label: "Título SEO", name: "title", widget: "string" }
          - { label: "Descripción SEO", name: "seo_description", widget: "text", required: false }
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Título Línea 1", name: "title_line1", widget: "string" }
              - { label: "Título Línea 2 (Acento)", name: "title_line2", widget: "string" }
              - { label: "Título Línea 3", name: "title_line3", widget: "string" }
              - { label: "Descripción", name: "description", widget: "text" }
          - label: "About (Grid de 4)"
            name: "about"
            widget: "list"
            fields:
              - { label: "Título", name: "title", widget: "string" }
              - { label: "Descripción", name: "description", widget: "string" }
          - label: "Métricas Principales"
            name: "metrics"
            widget: "list"
            fields:
              - { label: "Valor", name: "value", widget: "string" }
              - { label: "Etiqueta", name: "label", widget: "string" }
          - label: "Stack & Metodología"
            name: "stack"
            widget: "list"
            field: { label: "Herramienta", name: "tool", widget: "string" }
          - label: "Filosofía"
            name: "philosophy"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Cita Principal", name: "quote", widget: "text" }
              - { label: "Descripción Secundaria", name: "description", widget: "text" }
          - label: "Contacto"
            name: "contact"
            widget: "object"
            fields:
              - { label: "Badge Disponibilidad", name: "badge", widget: "string" }
              - { label: "Título", name: "title", widget: "string" }
              - { label: "Email", name: "email", widget: "string" }
              - { label: "Link LinkedIn", name: "linkedin", widget: "string" }
